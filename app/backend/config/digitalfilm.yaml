global_config:
  name: "film_pipeline_fuji_color_200"
  checkpoints_dir: "./runs"
  epoch: 50
  save_epoch: 0
  test_per_epoch: 5
  start_epoch: 0
  accum_steps: 1
  lr: [0.0002, 0.00002]
  grad_max_norm: 2.0
  use_cudnn_benchmark: True
  batch_size: 8
  metrics: ["ssim", "psnr"]
  uri: "localhost"
  port: 6666
  input_size: 1024
  crop_size: 256
  mid_reso: 1.125
  pre_transform_A: ["randomcrop"]
  pre_transform_B: ["randomcrop"]
  fp16: 1
  mfast: 0
  num_workers: 8
  log_to: "tensorboard"
  is_train: True
  dataroot: "D:/data/filmDataset/fuji_color_200"
  beta: ["0.5_0.9", "0.5_0.9"]
  optimizer: ["adamw", "adamw"]
  zero: 0
  img_log_num_samples: 4
  seed: 42
  checkpoint: "runs/20260727_160811/checkpoints/Epoch-15/model.pth"

model_config:
  use_checkpoint: True

  # ---- Film pipeline stages ----
  # Spectral mode: "linear" (SpectralMatrix + ResidualLUT3D)
  #                 or "density" (DensityCrosstalk, Phos-style)
  spectral_mode: "density"
  trc_points: 32              # per-channel 1D LUT control points
  residual_lut_dim: 17        # small 3D LUT for residual crossover (linear mode only)
  density_lut_dim: 9          # density 3D LUT dimension (density mode only, 9³=729 vertices)
  use_halation: True          # enables PyramidBloom (replaced old Halation)
  use_grain: True
  bloom_levels: 6             # Gaussian pyramid levels for Phos bloom

  # ---- Discriminator ----
  ndf: 64
  disc_n_layers: 3
  disc_norm_layer: "instance"
  disc_no_antialias: False
  disc_patch_size: 32

  # ---- GAN ----
  gan_loss: "lsgan"

  # ---- Loss weights (unpaired) ----
  lambda_swd: 1.0             # sliced Wasserstein distance
  lambda_hist: 1.0            # per-channel histogram matching
  lambda_cov: 0.5             # channel covariance (crossover proxy)
  lambda_lpips: 1.0           # perceptual distribution matching
  lambda_gan: 0.4             # adversarial loss

  # ---- LUT / TRC regularisers ----
  lambda_tv_res: 0.01         # TV on residual 3D LUT
  lambda_mn_res: 0.5         # monotonicity on residual 3D LUT
  lambda_tv_trc: 0.01         # smoothness on TRC 1D curves
  lambda_aniso: 0.01          # anisotropic TV on 3D LUT

  # ---- Histogram loss params ----
  hist_bins: 64
  hist_sigma: 0.02

checkpoints:
  kodak_gold_200: "D:/projects/digitalFilm/checkpoints/kodak_gold_200.pth"
  kodak_E100: "D:/projects/digitalFilm/checkpoints/kodak_E100.pth"
  fuji_color_200: "D:/projects/digitalFilm/checkpoints/fuji_color_200.pth"